brand: British_Airways
data:
  index_pairs: data/pairs_index.csv
  cluster_pairs: data/pairs_cluster.csv
  taxonomy: taxonomy/intents.yaml
retrieval:
  top_k: 5
  min_score: 0.05
  fallback_unfiltered: true
  hybrid_alpha: 0.55  # BM25 share; remainder is TF-IDF cosine
gate:
  # Fit on eval tau_curve (LLM classifier) — prefer auto-send precision over recall.
  confidence_tau: 0.55  # LLM curve is flat on [0.35, 0.55]; keep 0.55 as the published gate
  faithfulness_min_overlap: 0.12
models:
  # Groq free-tier catalogue as of this run (no Llama chat SKUs on the key).
  classifier: openai/gpt-oss-20b
  generator: openai/gpt-oss-20b
  # Different family than the generator (OpenAI vs Qwen).
  judge: qwen/qwen3.8-27b
  groq_base_url: https://api.groq.com/openai/v1
